[project]
name = "car-unit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sdbus>=0.11",
    # The daemon owns runtime state and the CLIs talk to it over the
    # socket, so these are not optional in practice -- and as an extra
    # they were dropped by `uv sync --reinstall-package car-unit`.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
can = ["python-can>=4.0"]

[project.scripts]
bt-call      = "cli.bt_call:main"
bt-media     = "cli.bt_media:main"
bt-devices   = "cli.bt_devices:main"
bt-phonebook = "cli.bt_phonebook:main"
bt-messages  = "cli.bt_messages:main"
gps          = "cli.gps:main"
svc          = "cli.svc:main"
settings     = "cli.settings:main"
lte          = "cli.lte:main"
wifi         = "cli.wifi:main"
hotspot      = "cli.hotspot:main"
audio        = "cli.audio:main"
fm           = "cli.fm:main"
weather      = "cli.weather:main"
places       = "cli.places:main"
geocode      = "cli.geocode:main"
navigate     = "cli.navigate:main"
source       = "cli.source:main"
carlibd      = "cli.carlibd:main"
can          = "cli.can:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["carlib*", "cli*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
